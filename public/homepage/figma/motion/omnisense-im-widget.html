<title>OmniSense — IM Widget (Animated)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#0e0e0e;display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:'Inter',system-ui,sans-serif}
  #scaler{position:relative}
  .stage{position:relative;width:1920px;height:900px;transform-origin:top left;overflow:hidden;background:#0e0e0e}
  .stage img.base{position:absolute;inset:0;width:1920px;height:900px;display:block;pointer-events:none}
  canvas#fx{position:absolute;inset:0;width:1920px;height:900px}
  /* floating data-source logos (cut from the artwork, screen-blended so black is invisible) */
  img.lg{position:absolute;display:block;pointer-events:none;will-change:transform}

  .orbfx{position:absolute;left:1046px;top:447px;width:0;height:0;pointer-events:none}
  .orbfx .glow{position:absolute;left:-105px;top:-105px;width:210px;height:210px;border-radius:50%;
    background:radial-gradient(circle,rgba(142,45,255,0.30),transparent 65%);
    animation:oglow 6.5s ease-in-out infinite}
  .orbfx .ring{position:absolute;left:-79px;top:-79px;width:158px;height:158px;border-radius:50%;
    border:1.5px solid rgba(165,87,255,0.55);animation:oring 6s ease-out infinite}
  .orbfx .ring.b{animation-delay:3s}
  @keyframes oglow{0%,100%{transform:scale(1);opacity:.65}50%{transform:scale(1.1);opacity:1}}
  @keyframes oring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.8);opacity:0}}

  .ribbonfx{position:absolute;left:1022px;top:194px;width:46px;height:166px;pointer-events:none;
    mix-blend-mode:screen;overflow:hidden;
    -webkit-mask:linear-gradient(180deg,transparent,#000 15%,#000 85%,transparent);
            mask:linear-gradient(180deg,transparent,#000 15%,#000 85%,transparent)}
  .ribbonfx::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,transparent,rgba(220,190,255,.5),transparent);
    background-size:100% 45%;background-repeat:no-repeat;
    animation:rflow 5.5s linear infinite}
  @keyframes rflow{0%{background-position:0 -55%}100%{background-position:0 190%}}

  .n{position:absolute;display:flex;align-items:center;font-weight:500;color:#fff;line-height:1}
  .n.center{justify-content:center}
  .n.right{justify-content:flex-end}
  .n .t{display:inline-block}
  .n .t.pop{animation:pop .7s ease}
  @keyframes pop{35%{transform:scale(1.07)}}
  .nv{position:absolute;display:flex;align-items:center;font-weight:500;line-height:1;
    font-family:'Inter',system-ui,sans-serif;overflow:hidden;white-space:nowrap}
  .nv.c{justify-content:center}
  .nv.r{justify-content:flex-end;padding-right:2px}
  .nv .p{color:#A6A6A6;font-weight:400;font-size:15px}
  .nv .v{display:inline-block}
  .nv .v.npop{animation:npop .55s ease}
  @keyframes npop{40%{transform:scale(1.10)}}
</style>

/* ---- live metrics: intro count-up, then a continuously running simulation ---- */
function ease(k){return 1-Math.pow(1-k,3);}
const S={alerts:1258,incidents:123,autonomous:39,manual:4,open:29,resolved:2,
         sev:[11,3,8,19],pctAuto:85,pctOpen:55,pctRes:3};
const EL={}, PEL={};
['alerts','autonomous','manual','incidents','open','resolved','sev0','sev1','sev2','sev3']
  .forEach(k=>{EL[k]=document.getElementById('v-'+k); PEL[k]=document.getElementById('p-'+k);});
function shown(k){
  if(k.slice(0,3)==='sev') return S.sev[+k.slice(3)];
  return S[k];
}
function pctOf(k){
  if(k==='autonomous') return S.pctAuto;
  if(k==='manual')     return 100-S.pctAuto;
  if(k==='open')       return S.pctOpen;
  if(k==='resolved')   return S.pctRes;
  return null;
}
function paint(k,val,pop){
  const el=EL[k]; if(!el) return;
  const t=String(val);
  if(el.textContent!==t){
    el.textContent=t;
    if(pop){el.classList.remove('npop'); void el.offsetWidth; el.classList.add('npop');}
  }
  const pe=PEL[k];
  if(pe){const q=pctOf(k); if(q!==null){const ps=q+'%'; if(pe.textContent!==ps) pe.textContent=ps;}}
}
/* intro: slow ordered cascade 0 -> real value */
const ORDER=[['alerts',400],['autonomous',1500],['manual',2300],['incidents',3200],
             ['open',4300],['sev0',5100],['sev1',5500],['sev2',5900],['sev3',6300],['resolved',7100]];
let liveAt=0;
ORDER.forEach(([k,delay])=>{
  const target=shown(k), dur=4200;
  setTimeout(()=>{const t0=performance.now();
    (function step(){
      const p=Math.min(1,Math.max(0,(performance.now()-t0)/dur));
      paint(k, Math.round(target*ease(p)), false);
      if(p<1) requestAnimationFrame(step);
    })();},delay);
  if(delay+dur>liveAt) liveAt=delay+dur;
});
/* live simulation — every metric keeps moving for as long as the page is open */
const rnd=(a,b)=>a+Math.random()*(b-a);
let simStarted=false, nxt=null;
function simulate(tt){
  if(!simStarted){
    if(tt*1000 < liveAt+800) return;
    simStarted=true;
    nxt={alerts:tt+rnd(1.2,3.0), incident:tt+rnd(6,13), resolve:tt+rnd(14,26),
         sev:[tt+rnd(8,18),tt+rnd(8,18),tt+rnd(8,18),tt+rnd(8,18)], pct:tt+rnd(12,26)};
  }
  if(tt>=nxt.alerts){                       /* alert stream: fast, always climbing */
    S.alerts += 1+Math.floor(Math.random()*3);
    paint('alerts',S.alerts,true);
    nxt.alerts = tt+rnd(1.2,3.0);
  }
  if(tt>=nxt.incident){                     /* a new incident is raised */
    S.incidents += 1; S.open += 1;
    if(Math.random() < S.pctAuto/100) S.autonomous += 1; else S.manual += 1;
    const i=Math.floor(Math.random()*4); S.sev[i]=Math.min(99,S.sev[i]+1);
    paint('incidents',S.incidents,true); paint('open',S.open,true);
    paint('autonomous',S.autonomous,true); paint('manual',S.manual,true);
    paint('sev'+i,S.sev[i],true);
    nxt.incident = tt+rnd(6,13);
  }
  if(tt>=nxt.resolve){                      /* one gets resolved; rate rises with backlog */
    if(S.open>10){
      S.open -= 1; S.resolved += 1;
      const cand=[0,1,2,3].filter(i=>S.sev[i]>0);
      if(cand.length){const i=cand[Math.floor(Math.random()*cand.length)];
        S.sev[i]-=1; paint('sev'+i,S.sev[i],true);}
      paint('open',S.open,true); paint('resolved',S.resolved,true);
    }
    const load=Math.max(0,S.open-28);
    nxt.resolve = tt+Math.max(4, rnd(14,26)-load*0.7);
  }
  for(let i=0;i<4;i++){                     /* priority mix shifts on its own */
    if(tt>=nxt.sev[i]){
      S.sev[i]=Math.max(0,Math.min(99,S.sev[i]+(Math.random()<0.5?-1:1)));
      paint('sev'+i,S.sev[i],true);
      nxt.sev[i]=tt+rnd(8,18);
    }
  }
  if(tt>=nxt.pct){                          /* percentages drift plausibly */
    S.pctAuto=Math.max(82,Math.min(89,S.pctAuto+(Math.random()<0.5?-1:1)));
    S.pctOpen=Math.max(51,Math.min(59,S.pctOpen+(Math.random()<0.5?-1:1)));
    S.pctRes =Math.max(2, Math.min(6,  S.pctRes +(Math.random()<0.5?-1:1)));
    ['autonomous','manual','open','resolved'].forEach(k=>paint(k,shown(k),false));
    nxt.pct = tt+rnd(12,26);
  }
}

function mkPath(pts){
  const cum=[0];
  for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  return {pts:pts, cum:cum, len:cum[cum.length-1]};
}
function ptAt(p,s){
  const d=Math.max(0,Math.min(1,s))*p.len;
  let lo=0, hi=p.cum.length-1;
  while(lo<hi-1){const mid=(lo+hi)>>1; if(p.cum[mid]<=d) lo=mid; else hi=mid;}
  const seg=(p.cum[hi]-p.cum[lo])||1, t=(d-p.cum[lo])/seg;
  return [p.pts[lo][0]+(p.pts[hi][0]-p.pts[lo][0])*t,
          p.pts[lo][1]+(p.pts[hi][1]-p.pts[lo][1])*t];
}
const P={};
['sev0','sev1','sev2','sev3','arcPurpleTop','arcGreyTop','arcPurpleBot','arcGreyBot']
  .forEach(k=>{P[k]=mkPath(PATHS[k]);});
const FIB=PATHS.fibers.map(mkPath);
/* Open Incidents -> Resolved Incidents (one flow per severity) */
const SEVP=[{k:'sev0',col:'#F0605C'},{k:'sev1',col:'#F2A344'},
            {k:'sev2',col:'#F0C654'},{k:'sev3',col:'#52DC8D'}];
/* Total Alerts -> Autonomous / Manual, then both -> Open Incidents */
const ARCP=[{k:'arcPurpleTop',col:'#C9A9FF'},{k:'arcGreyTop',col:'#CFCADD'},
            {k:'arcPurpleBot',col:'#C9A9FF'},{k:'arcGreyBot',col:'#CFCADD'}];
const fCols=['#F5A64F','#A557FF','#4FD8C0','#E056C7','#C79BFF','#7ee0a3'];
const CH=LOGOS.map((l,i)=>{
  const f=FIB[i%FIB.length];
  return {li:i, fib:f, tip:f.pts[0], col:fCols[i%fCols.length],
          phase:(i%12)/12+(i>=12?0.04:0)};
});
const DUST_RGB=DUST_PAL.map(c=>'rgb('+c[0]+','+c[1]+','+c[2]+')');
const T=8.0;
let t0=null;
function frame(){
  const now=performance.now();
  if(!t0)t0=now;
  const tt=(now-t0)/1000;
  simulate(tt);

  /* float every logo (slow, organic, each its own drift) */
  for(let i=0;i<LOGOS.length;i++){
    const l=LOGOS[i];
    l._dx=l.ax*Math.sin(tt*(6.2832/l.px)+l.ph);
    l._dy=l.ay*Math.sin(tt*(6.2832/l.py)+l.ph2);
    els[i].style.transform='translate('+l._dx.toFixed(2)+'px,'+l._dy.toFixed(2)+'px)';
  }

  ctx.clearRect(0,0,stageW,stageH);
  /* ---- live floating dust field (extracted from the artwork) ---- */
  for(let i=0;i<DUST_B.length;i++){
    const b=DUST_B[i], t=DUST_T[i];
    ctx.globalAlpha=0.86+0.14*Math.sin(tt*t.w+t.p);
    ctx.fillStyle=DUST_RGB[i];
    for(let k=0;k<b.length;k+=5){
      const m=DUST_M[b[k+3]], ph=b[k+4]*0.0982;
      const dx=m.ax*Math.sin(tt*m.wx+ph), dy=m.ay*Math.sin(tt*m.wy+ph+1.7);
      const sz=b[k+2];
      ctx.fillRect(Math.round(b[k]+dx), Math.round(b[k+1]+dy), sz, sz);
    }
  }
  ctx.globalAlpha=1;

  for(const ch of CH){
    const l=LOGOS[ch.li];
    const src=[l.cx+(l._dx||0), l.cy+(l._dy||0)];          /* packets leave the FLOATING logo */
    const ctrl1=[(src[0]+ch.tip[0])/2,(src[1]+ch.tip[1])/2-20];
    for(let j=0;j<3;j++){                                  /* steady stream along the fibre */
      const sp=((tt/6.5)+ch.phase+j/3)%1;
      const p=ptAt(ch.fib,sp);
      ctx.fillStyle=ch.col+Math.round(Math.sin(Math.PI*sp)*100).toString(16).padStart(2,'0');
      ctx.beginPath();ctx.arc(p[0],p[1],1.7,0,7);ctx.fill();
    }
    const u=((tt/T)+ch.phase)%1;
    if(u<0.52){                                            /* logo -> fibre tip (open space) */
      const s=ease(u/0.52);
      const p=qbez(src,ctrl1,ch.tip,s);
      const fade=Math.sin(Math.PI*(u/0.52));
      ctx.fillStyle='rgba(199,155,255,'+(0.85*fade)+')';
      ctx.beginPath();ctx.arc(p[0],p[1],3,0,7);ctx.fill();
      for(let q=1;q<=3;q++){const pp=qbez(src,ctrl1,ch.tip,Math.max(0,s-q*0.02));
        ctx.fillStyle='rgba(199,155,255,'+(0.85*fade*(1-q*0.28))+')';
        ctx.beginPath();ctx.arc(pp[0],pp[1],2.4-q*0.4,0,7);ctx.fill();}
    }
    const df=u-0.52;
    if(df>=0 && df<0.09){                                  /* the branch takes the data in */
      const k=df/0.09;
      ctx.strokeStyle=ch.col+Math.round((1-k)*180).toString(16).padStart(2,'0');
      ctx.lineWidth=1.4;
      ctx.beginPath();ctx.arc(ch.tip[0],ch.tip[1],3+k*12,0,7);ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,'+(0.8*(1-k))+')';
      ctx.beginPath();ctx.arc(ch.tip[0],ch.tip[1],2.4+k*2,0,7);ctx.fill();
    }
    if(u>=0.52 && u<0.84){                                 /* pulse rides the fibre to the orb */
      const s=(u-0.52)/0.32;
      const p=ptAt(ch.fib,s);
      const fade=Math.sin(Math.PI*s);
      ctx.globalAlpha=0.92*fade; ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(p[0],p[1],2.6,0,7);ctx.fill();
      ctx.globalAlpha=1;
      for(let q=1;q<=5;q++){const pp=ptAt(ch.fib,Math.max(0,s-q*0.03));
        ctx.fillStyle=ch.col+Math.round(fade*(1-q*0.18)*170).toString(16).padStart(2,'0');
        ctx.beginPath();ctx.arc(pp[0],pp[1],2.1-q*0.24,0,7);ctx.fill();}
    }
    const db=u-0.84;
    if(db>=0 && db<0.1){
      const k=db/0.1, e=ptAt(ch.fib,1);
      ctx.strokeStyle='rgba(199,155,255,'+(0.45*(1-k))+')';
      ctx.lineWidth=1.2;
      ctx.beginPath();ctx.arc(e[0],e[1],2.5+k*9,0,7);ctx.stroke();
    }
  }
  for(let j=0;j<ARCP.length;j++){                          /* pulses along the connector arcs */
    const pth=P[ARCP[j].k], u=((tt/11)+(j*0.23))%1;
    if(u<0.80){
      const s=ease(u/0.80), pt=ptAt(pth,s), fade=Math.sin(Math.PI*(u/0.80));
      ctx.fillStyle=ARCP[j].col+Math.round(fade*225).toString(16).padStart(2,'0');
      ctx.beginPath();ctx.arc(pt[0],pt[1],3,0,7);ctx.fill();
      for(let q=1;q<=3;q++){const pp=ptAt(pth,Math.max(0,s-q*0.03));
        ctx.fillStyle=ARCP[j].col+Math.round(fade*(1-q*0.30)*165).toString(16).padStart(2,'0');
        ctx.beginPath();ctx.arc(pp[0],pp[1],2.4-q*0.4,0,7);ctx.fill();}
    }
  }
  for(let j=0;j<SEVP.length;j++){                          /* Open Incidents -> Resolved */
    const pth=P[SEVP[j].k];
    for(let h=0;h<2;h++){
      const u=((tt/10)+(j*0.17)+h*0.5)%1;
      if(u<0.78){
        const s=ease(u/0.78), pt=ptAt(pth,s), fade=Math.sin(Math.PI*(u/0.78));
        ctx.fillStyle=SEVP[j].col+Math.round(fade*230).toString(16).padStart(2,'0');
        ctx.beginPath();ctx.arc(pt[0],pt[1],2.8,0,7);ctx.fill();
        for(let q=1;q<=3;q++){const pp=ptAt(pth,Math.max(0,s-q*0.032));
          ctx.fillStyle=SEVP[j].col+Math.round(fade*(1-q*0.28)*160).toString(16).padStart(2,'0');
          ctx.beginPath();ctx.arc(pp[0],pp[1],2.2-q*0.4,0,7);ctx.fill();}
      }
    }
  }
  lastTick=now;
  if(useRaf) requestAnimationFrame(frame);
}
/* rAF normally; if it is throttled (hidden tab / embedded viewers) fall back to a
   timer so the animation still runs instead of showing one frozen frame */
let lastTick=0, useRaf=true, fallback=null;
function startFallback(){
  if(fallback) return;
  useRaf=false; fallback=setInterval(frame, 33);
}
requestAnimationFrame(frame);
setTimeout(()=>{ if(!lastTick) startFallback(); },700);
setInterval(()=>{ if(performance.now()-lastTick>600) startFallback(); },2000);
